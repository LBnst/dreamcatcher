#integration + livraison continue
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  #conformité du code
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest  # Machine Linux fournie gratuitement par GitHub
    steps:
      - uses: actions/checkout@v5  # Récupère le code du dépôt
      - uses: actions/setup-python@v6  # Installe Python
        with:
          python-version: "3.12"
          cache: pip  # Garde les paquets en cache pour accélérer les prochaines exécutions
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .  # Erreurs de style et de code
      - run: ruff format --check .  # Formatage (vérifie sans rien modifier)

  #tests de couverture
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dreamcatcher
          POSTGRES_USER: dreamcatcher
          POSTGRES_PASSWORD: dreamcatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dreamcatcher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: cle-de-test-ci
      DEBUG: "False"
      DATABASE_URL: postgres://dreamcatcher:dreamcatcher@localhost:5432/dreamcatcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-report=term-missing

  #check docker
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t dreamcatcher:ci .

  #livraison continue : publie l'image sur ghcr.io après une fusion dans main,
  #uniquement si les trois contrôles précédents sont verts
  publier:
    name: Publication de l'image
    needs: [lint, tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier l'image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"  # le nom doit être en minuscules
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"