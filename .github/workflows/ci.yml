#integration continue
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  #conformité du code
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  #tests de couverture
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dreamcatcher
          POSTGRES_USER: dreamcatcher
          POSTGRES_PASSWORD: dreamcatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dreamcatcher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: cle-de-test-ci
      DEBUG: "False"
      DATABASE_URL: postgres://dreamcatcher:dreamcatcher@localhost:5432/dreamcatcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing

  #check docker
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t dreamcatcher:ci .