services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dreamcatcher
      POSTGRES_USER: dreamcatcher
      POSTGRES_PASSWORD: dreamcatcher
    volumes:
      - pgdata:/var/lib/postgresql/data
      - .:/app
      - hf_cache:/root/.cache/huggingface
    ports:
      - "5432:5432"
    healthcheck:
    #check également si postgresql est prêt 
      test: ["CMD-SHELL", "pg_isready -U dreamcatcher -d dreamcatcher"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://dreamcatcher:dreamcatcher@db:5432/dreamcatcher
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
#données restent enregistrées quand la base est arrêtée
  pgdata:
  hf_cache: