[project]
name = "dreamcatcher"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = ["D100", "D104", "D105", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"manage.py" = ["D"]
"config/asgi.py" = ["D"]
"config/wsgi.py" = ["D"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]


###étendue et seuil de couverture par les tests
[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    "*/migrations/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "scripts/*",
    "gunicorn.conf.py",
    "installer.py",
    "locustfile.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true