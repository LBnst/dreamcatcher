<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Dreamcatcher{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'accueil' %}">Dreamcatcher</a>
      <div class="navbar-nav ms-auto align-items-center">
        {% if user.is_authenticated %}
          <span class="navbar-text me-3">{{ user.email }}</span>
          <form method="post" action="{% url 'deconnexion' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Se déconnecter</button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'connexion' %}">Se connecter</a>
          <a class="nav-link" href="{% url 'inscription' %}">Créer un compte</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
